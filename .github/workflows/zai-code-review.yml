name: GLM 5.3 PR Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: zai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR with GLM 5.3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # pull_request_target exposes repository secrets and a write-capable token.
    # Never run this privileged job for branches from untrusted forks.
    if: >-
      ${{ github.event.pull_request.draft == false &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
    steps:
      - name: Z.ai Code Review
        if: ${{ env.ZAI_API_KEY != '' }}
        # Pin privileged third-party actions to an immutable commit.
        uses: L-K-M/zai-code-review@7d0ce7b0c226c70eed194615130fa5b632ba4798
        with:
          ZAI_API_KEY: ${{ env.ZAI_API_KEY }}
          # Flash rather than plain glm-5.3. The action sends no `reasoning_effort`,
          # and that parameter defaults to `max` -- so every review ran GLM-5.3 at
          # maximum reasoning effort, non-streaming and with no token cap. Requests
          # were accepted and then never answered inside the action's hardcoded
          # 300s per-attempt timeout (see PR #70, run 34097800960: two clean 300s
          # timeouts on an 18,958-char single-chunk prompt, then HTTP 429).
          ZAI_MODEL: glm-5.3-flash
          ZAI_REVIEWER_NAME: GLM 5.3 Flash Code Review
          GITHUB_TOKEN: ${{ github.token }}

      - name: Skip when Z.ai API key is unavailable
        if: ${{ env.ZAI_API_KEY == '' }}
        run: echo "Skipping Z.ai review because ZAI_API_KEY is not configured."
